    <script>
        $(document).ready(function () {
            feather.replace();
            
            $("#logout").on("click", function (e) {
                $("#logout-form").submit();
            });
        
            // Activate SimpleLightbox plugin for portfolio items
            let port = new SimpleLightbox({
                elements: '#portfolio a.portfolio-box'
            });

            var font = new FontFaceObserver('Merriweather', { weight: 400 });

            font.load().then(function () {
                console.log('Font is available');
            }, function () {
                console.log('Font is not available');
            });

            // Scroll ke atas
            document.addEventListener("scroll", function() {
                var scrollPosition = window.pageYOffset || document.documentElement.scrollTop;
                if (scrollPosition > 100) {
                    document.querySelector('.back-to-top').style.display = 'block';
                } else {
                    document.querySelector('.back-to-top').style.display = 'none';
                }
            });

            document.querySelector('.back-to-top').addEventListener('click', function(e) {
                e.preventDefault();
                window.scrollTo({top: 0, behavior: 'smooth'});
            });

            //ajax daftar kolaborator
            $('#buat-akun').click(function(event) {
                //alert("buat akun");
                //debugger;
                event.preventDefault();
                var fullName = $("#nama").val();
                var email = $("#email").val();
                var pwd = $("#password").val();

                var jsonData = {
                    nama : fullName,
                    email: email,
                    password: pwd
                };

                var token = $("meta[name='_csrf']").attr("content");
                var header = $("meta[name='_csrf_header']").attr("content");

                $.ajax({
                    //url: contextPath +'kolaborator/daftar',  
                    url: 'https://localhost:8443/SIMBKSD/kolaborator/daftar',
                    type: 'POST',
                    contentType: 'application/json',
                    "headers": {
                        [header]: token  // Include the CSRF token in the request header
                    },
                    data: JSON.stringify(jsonData),
                    success: function(response) {
                        console.log('Success:', response);
                        // Handle success
                        if (response.status=='Sukses') {
                            $("#daftarModal").modal('hide');
                            $("#suksesDaftarModal").modal("show");
                        }
                    },
                    error: function(xhr, status, error) {
                        console.log('Error:', error);
                        // Handle error
                    }
                });
            });            
        });

        function showDaftarModal() {
            $('#daftarModal').modal('show');
        }

    </script>
