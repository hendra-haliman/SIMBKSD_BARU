<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/general.html :: header('Edit User')}"></head>

<body class="sbnav-fixed">
    <nav th:replace="~{fragments/general.html :: navigation}"></nav>
    <div id="layoutSidenav">
        <div id="layoutSidenav_nav" th:include="~{fragments/general.html :: layoutSidenav_nav}"></div>

        <div id="layoutSidenav_content" class="background01">
            <main>
                <div class="container-fluid px-4 mt-5">
                    <div class="row justify-content-center">
                        <div class="col-lg-7">
                            <div class="card shadow-lg border-0 rounded-lg mt-3">
                                <form th:action="@{/user/saveEdit}"  method="post"
                                    th:object="${pemakai}">

                                    <input type="hidden" th:field="*{id}"/>
                                    <div class="card-header justify-content-center">
                                        <h4 class="fw-light my-2">Edit User</h4>
                                    </div>
                                    <div class="card-body">

                                        <div class="row gx-3 mb-3">
                                            <div class="col-md-6">
                                                <label class="small mb-1" for="title">Title</label>
                                                <input th:field="*{title}" class="form-control form-control-md"
                                                    id="title" type="text" placeholder="Masukan Title" />
                                            </div>
                                            <div class="col-md-6">
                                                <label class="small mb-1" for="jabatan">Jabatan</label>
                                                <input th:field="*{jabatan}" class="form-control form-control-md"
                                                    id="jabatan" type="text" placeholder="Masukan Jabatan" />
                                            </div>
                                        </div>
                                        <div class="row gx-3 mb-3">
                                            <div class="col-md-6">
                                                <label class="small mb-1" for="namaDepan">Nama Depan</label>
                                                <input th:field="*{namaDepan}" class="form-control form-control-md"
                                                    id="namaDepan" type="text" placeholder="Masukan Nama Depan" />
                                            </div>
                                            <div class="col-md-6">
                                                <label class="small mb-1" for="namaDepan">Nama Keluarga</label>
                                                <input th:field="*{namaKeluarga}" class="form-control form-control-md"
                                                    id="namaKeluarga" type="text" placeholder="Masukan Nama Keluarga" />
                                            </div>
                                        </div>
                                        <div class="row gx-3 mb-3">
                                            <div class="col-md-6">
                                                <label class="small mb-1" for="email">Email</label>
                                                <input th:field="*{email}" class="form-control form-control-md"
                                                    id="email" type="text" placeholder="Masukan Email" />
                                            </div>
                                            <div class="col-md-6">
                                                <label class="small mb-1" for="roles">Role</label>
                                                <select class="form-select form-select-sm" th:field="*{roles}">
                                                    <option value="">Pilih Role</option>
                                                    <option th:each="role: ${roles}"
                                                            th:value="${role.id}"
                                                            th:text="${role.name}"></option>
                                                </select>    
                                            </div>
                                        </div>
                                        <div class="row gx-3 mb-3">
                                            <div class="col-md-6">
                                                <label class="small mb-1" for="enabled">Aktif ?</label>
                                                <input th:field="*{enabled}" 
                                                    id="enabled" type="checkbox"/>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="card-footer text-center">
                                        <button class="btn btn-primary btn-block" type="submit">Simpan</button>
                                    </div>
                                </form>

                            </div>
                        </div>
                    </div>

                </div>

            </main>
            <footer th:replace="~{fragments/general.html :: footer}"></footer>
        </div>
    </div>

    <div th:replace="~{fragments/general.html :: script}"></div>
</body>
<script>
    var counter = 1;

    $(document).ready(function () {

    });
</script>

</html>
