<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/general.html :: header('Login')}"></head>

<body class="nav-fixed bg-primary" th:style="'background: url(/SIMBKSD/static/assets/img/office.jpg) no-repeat center fixed;'">
    <nav th:replace="~{fragments/general.html :: navigation}"></nav>
    <div id="layoutAuthentication">
        <div id="layoutAuthentication_content">
            <main>
                <div class="container-xl px-4 mt-5">

                    <div class="row justify-content-center">
                        <div class="col-lg-5">
                            <div class="card shadow-lg border-0 rounded-lg mt-5">
                                <div class="card-header justify-content-center">
                                    <h3 class="fw-light my-4">Login</h3>
                                </div>
                                <div class="card-body">
                                    <div th:if="${param.error}" class="text-end">
                                        <i class="alert alert-danger">Error! Invalid email / password !</i>
                                    </div>
                                    <div th:if="${param.logout}" class="text-end">
                                        <i class="alert alert-info">Anda telah logout ! Harap login kembali.</i>
                                    </div>
                                    <div th:if="${param.errorCaptcha}" class="text-end">
                                        <i class="alert alert-danger">Captcha salah.</i>
                                    </div>
                                    
                                    <br>
                                    <form id="loginForm" th:action="@{/authenticateUser}" method="post">
                                        <input type="hidden" id="response" name="response" value="" />
                                        <div class="mb-3">
                                            <label class="small mb-1" for="email">Email</label>
                                            <input class="form-control" id="email" name="email" type="email"
                                                placeholder="Masukan email address" autocomplete="on" />
                                        </div>
                                        <div class="mb-3">
                                            <label class="small mb-1" for="password">Password</label>
                                            <input class="form-control" id="password" name="password" type="password"
                                                placeholder="Masukan password" autocomplete="off" />
                                        </div>

                                        <div class="mb-3 row">
                                            <div class="col">
                                                <input class="form-control" type="text" placeholder="captcha" name="captcha"/>
                                            </div>
                                            <div class="col text-right">
                                                <button class="btn btn-outline-info float-right" type="button" onClick="loadImg()" style="height:50px;float:right;">
                                                    <img th:src="@{/static/assets/img/reload.svg}" alt="Reload Captcha" width="32" height="32">                                                
                                                </button>
                                            </div>
                                            <div class="col">
                                                <img id="myimg" th:src="'data:image/png;base64,' + ${base64Image}" />                                            
                                            </div>
                                        </div>                                        

                                        <div class="d-flex align-items-center justify-content-between mt-4 mb-0">
                                            <a class="small" th:href="@{/forgotPassword}">Lupa Password?</a>
                                            <!--a class="btn btn-primary" href="dashboard-1.html">Login</a-->
                                            <button class="btn btn-primary" type="submit">Login</button>
                                        </div>
                                    </form>
                                </div>
                                <div class="card-footer text-center">
                                    <div class="small"><a href="auth-register-basic.html">Butuh akun? Silahkan
                                            daftar</a></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
        <div id="layoutAuthentication_footer">
            <footer th:replace="~{fragments/general.html :: footer}"></footer>
        </div>
    </div>
<!--
    <script th:src="@{/static/js/bootstrap.min.js}"></script>
-->
    <div th:replace="~{fragments/general.html :: script}"></div>


    <script>
        
        var token = $("meta[name='_csrf']").attr("content");
        var header = $("meta[name='_csrf_header']").attr("content");

        function loadImg(event) {
            $.ajax({
                url: contextPath + 'captcha/getCaptcha',
                method: 'GET',
                "headers": {
                        [header]: token  
                },
                success: function(base64Image) {
                    if (base64Image) {
                        $('#myimg').attr('src', 'data:image/png;base64,' + base64Image);
                    } else {
                        alert('Masalah loading captcha');
                    }
                },
                error: function() {
                    alert('error mendapatkan captcha');
                } 
            });
        }


    </script>

</body>

</html>
