<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/general.html :: header('Reset Password')}"></head>
<body class="bg-primary">
<div id="layoutAuthentication">
    <div id="layoutAuthentication_content">
        <main>
            <div class="container-xl px-4">
                <div class="row justify-content-center">
                    

                    <div class="col-lg-5">
                        <div class="card shadow-lg border-0 rounded-lg mt-5">
                            <div class="card-header justify-content-center"><h3 class="fw-light my-4">Reset Password</h3>
                                <div th:if="${errorMessage} != null" th:text="${errorMessage}" class="alert alert-warning" role="alert"></div>
                            </div>
                            
                            <div class="card-body">
                                <form th:action="@{/resetPassword3}" method="post" th:object="${changePasswordDTO}">
                                    <div class="mb-3">
                                        <label class="small mb-1" for="newPassword">Password baru</label>
                                        <input th:field="*{newPassword}" class="form-control" id="newPassword" name="newPassword" type="password" placeholder="Masukan password" />
                                    </div>
                                    <div class="mb-3">
                                        <label class="small mb-1" for="confirmPassword">Konfirmasi Password</label>
                                        <input th:field="*{confirmPassword}" class="form-control" id="confirmPassword" name="confirmPassword" type="password" placeholder="Konfirmasi password" />
                                    </div>
                                    <input type="hidden" th:field="*{resetStr}" name="resetStr" th:value="${resetStr}"></input>
                                    <div class="d-flex align-items-center justify-content-between mt-4 mb-0">
                                        <button type="submit" class="btn btn-primary">Reset Password</button>
                                    </div>
                                </form>
                                <div class="d-flex align-items-center justify-content-between mt-4 mb-0">
                                    <a class="small" th:href="@{/showLoginForm}">Kembali ke login</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div id="layoutAuthentication_footer">
        <footer th:replace="~{fragments/general.html :: footer}"></footer>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script th:src="@{/static/js/scripts.js}"></script>

</body>
</html>
