<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/general.html :: header('Managemen User')}"></head>

<body class="nav-fixed">

            <path d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"/>

    <nav th:replace="~{fragments/general.html :: navigation}"></nav>
    <div id="layoutSidenav">
        <div id="layoutSidenav_nav" th:include="~{fragments/general.html :: layoutSidenav_nav}"></div>

        <div id="layoutSidenav_content">
            <main>
                <header
                    th:replace="~{fragments/content-header.html :: content-header('Managemen User','','user')}">
                </header>
                <!-- Main page content-->
                <div class="container-fluid px-4 mt-n10">
                    <div class="card mb-4">
                        <div class="card-header">Data User</div>
                        <div class="card-body">
                            <table id="userTable"
                                class="table table-bordered table-striped table-responsive table-compact table-sm"
                                style="width:100%">
                                <thead>
                                    <tr>
                                        <th>No</th>
                                        <th>Title</th>
                                        <th>Nama Depan</th>
                                        <th>Nama Keluarga</th>
                                        <th>Email</th>
                                        <th>Aktif ?</th>
                                        <th>Roles</th>
                                        <th>Privilege</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody></tbody>

                            </table>
                        </div>
                    </div>


                </div>
            </main>
            <footer th:replace="~{fragments/general.html :: footer}"></footer>
        </div>
    </div>
    <script th:src="@{/static/js/bootstrap.bundle.min.js}" crossorigin="anonymous"></script>
    <script th:src="@{/static/js/scripts.js}"></script>
    <script th:src="@{/static/js/litepicker.bundle.js}" crossorigin="anonymous"></script>
    <script th:src="@{/static/js/litepicker.js}"></script>
    <script th:src="@{/static/js/jquery-3.7.1.min.js}"></script>
    <!--script th:src="@{/static/js/datatables.min.js}"></script-->
    <script
        src="https://cdn.datatables.net/v/bs5/dt-2.0.6/b-3.0.2/r-3.0.2/sc-2.4.2/sl-2.0.1/datatables.min.js"></script>
    <script th:inline="javascript">
        var contextPath = /*[[@{/}]]*/ '';            
    </script>

    <script>
        $(document).ready(function () {
            $("#userTable").dataTable({
                "processing": true,
                "serverSide": true,
                "searchDelay": 1000,
                "ordering": false,
                "ajax": {
                    "url": contextPath + "api/pemakai/list",
                    "type": "POST",
                    "dataType": "json",
                    "cache": "no-cache",
                    "contentType": "application/json",
                    "data": function (d) {
                        return JSON.stringify(d);
                    },
                    "dataSrc": function (json) {
                        if (json.redirect) {
                            window.location.href = json.location;
                        }
                        return json.data;
                    },
                    "error": function (xhr, error, thrown) {
                        if (xhr.status === 401) {
                            window.location.href = contextPath + "logout"; // Redirect to login page
                        }
                    }
                },

                "columns": [
                    {
                        "data": null,
                        "targets": 0,
                        "render": function (data, type, row, meta) {
                            return meta.row + meta.settings._iDisplayStart + 1
                        }
                    },
                    { "data": "title" },
                    { "data": "namaDepan" },
                    { "data": "namaKeluarga" },
                    { "data": "email" },
                    { "data": "enabled" ,
                      "render": function (data, type, row, meta) {
                        if (data==true) {
                            // return "<svg class='myicon'><use xlink:href='#check'></use></svg>";
                            return "v"
                        } else {
                            // return "<i style='color: red;' class='fa-solid fa-xmark'></i>";
                            return "x"
                        }
                      }
                    },
                    {
                        "data": "roles",
                        "render": function (data, type, row, meta) {
                            if (data && data.length > 0) {
                                return data[0].name;
                            } else {
                                return "No Role Assigned"; // Custom message for no roles
                            }
                        }
                    },
                    {   "data": null,
                        "render": function (data, type, row, meta) {
                            return "N/A";
                        }
                    },
                    {
                        "data": null,
                        "render": function (data, type, row, meta) {
                            return "<a href='admin/viewUserProfile/" + row.id + "' data-bs-toggle='tooltip' data-bs-placement='top' title='Edit User Profile'><i class='fa-solid fa-pencil'></i></a>";
                        }
                    }
                ],
                "oLanguage": {
                    "sInfo": "Menampilkan <strong>_START_</strong> sampai <strong>_END_</strong> , total: <strong>_TOTAL_</strong> items"
                },
                "language": {
                    "lengthMenu": "_MENU_ &nbsp;records per halaman",
                    "emptyTable": "Maaf, tidak ada data tersedia."
                }
            });

        });
    </script>

</body>

</html>
