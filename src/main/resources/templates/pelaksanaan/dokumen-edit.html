<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/general.html :: header('Edit Dokumen')}"></head>

<body class="nav-fixed">
    <nav th:replace="~{fragments/general.html :: navigation}"></nav>
    <div id="layoutSidenav">
        <div id="layoutSidenav_nav" th:include="~{fragments/general.html :: layoutSidenav_nav}"></div>

        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4 py-3 mt-auto">
                    <div class="row justify-content-center">
                        <div class="col-lg-7">
                            <div class="card shadow-lg border-0 rounded-lg mt-5">
                                <form th:action="@{/dokumen/saveEdit}" enctype="multipart/form-data" method="post" th:object="${dokumenKerjaSama}">
                                    <input type="hidden" th:field="*{id}"/>
                                    <div class="card-header justify-content-center">
                                        Edit Dokumen Kerja Sama
                                    </div>
                                    <div class="card-body">
                                        <div class="mb-3">
                                            <label class="small mb-1" for="tahun">Tahun</label>
                                            <input class="form-control form-control-md" th:field="*{tahun}">
                                        </div>


                                        <div class="mb-3">
                                            <label class="small mb-1" for="bagian">Bagian</label>
                                            <select class="form-select form-select-sm" th:field="*{bagian}">
                                                <option value="">Pilih Bagian</option>
                                                <option th:each="bagian: ${bagianList}"
                                                        th:value="${bagian.id}"
                                                        th:text="${bagian.nama}"></option>
                                            </select>    
                                        </div>

                                        <div class="mb-3">
                                            <label class="small mb-1" for="opd">OPD</label>
                                            <select class="form-select form-select-sm" th:field="*{opd}" id="opd" name="opd[]" multiple="multiple">
                                                <!--option value="">Pilih OPD</option-->
                                                <option th:each="opd: ${opdList}"
                                                        th:value="${opd.id}"
                                                        th:text="${opd.nama}"></option>
                                            </select>    
                                        </div>


                                        <div class="mb-3">
                                            <label class="small mb-1" for="rumpunopd">Rumpun OPD</label>
                                            <select class="form-select form-select-sm" th:field="*{rumpun_opd}" id="rumpunopd" name="rumpunopd[]" multiple="multiple">
                                                <!--option value="">Pilih OPD</option-->
                                                <option th:each="rumpun_opd: ${rumpunOpdList}"
                                                        th:value="${rumpun_opd.id}"
                                                        th:text="${rumpun_opd.nama}"></option>
                                            </select>    
                                        </div>


                                        <div class="mb-3">
                                            <label class="small mb-1" for="jenisMitra">Jenis Mitra</label>
                                            <select class="form-select form-select-sm" th:field="*{jenisMitra}">
                                                <option value="">Pilih Jenis Mitra</option>
                                                <option th:each="jenisMitra: ${jenisMitraList}"
                                                        th:value="${jenisMitra.id}"
                                                        th:text="${jenisMitra.nama}"></option>
                                            </select>    
                                        </div>
                                        <div class="mb-3">
                                            <label class="small mb-1" for="mitraKerjaSama">Mitra Kerja Sama</label>
                                            <textarea th:field="*{mitraKerjaSama}" class="form-control form-control-md" id="mitraKerjaSama"
                                                placeholder="Masukkan Mitra Kerja Sama" spellcheck="false"></textarea>
                                        </div>

                                        <div class="mb-3">
                                            <label class="small mb-1" for="judulDokumenPerjanjian">Judul Dokumen
                                                Perjanjian</label>
                                            <textarea th:field="*{judulDokumenPerjanjian}" class="form-control form-control-md" id="judulDokumenPerjanjian"
                                                placeholder="Masukkan Judul Dokumen Perjanjian" spellcheck="false"></textarea>
                                        </div>

                                        <div class="row gx-3">
                                            <div class="col-md-6">
                                                <div class="mb-3">
                                                    <label class="small mb-1" for="noDokumenPerjanjian">No Dokumen
                                                        Perjanjian</label>
                                                    <textarea th:field="*{noDokumenPerjanjian}" class="form-control form-control-md autosize"
                                                        id="noDokumenPerjanjian"
                                                        placeholder="Masukkan Nomor Dokumen Perjanjian" spellcheck="false"></textarea>
                                                </div>
                                            </div>
                                            <div class="col-md-6">
                                                <div class="mb-3">
                                                    <label class="small mb-1" for="tglPenetapan">Tanggal
                                                        Penetapan</label>
                                                    <input th:field="*{tglPenetapan}" class="form-control form-control-md" id="tglPenetapan"
                                                        type="date" />
                                                </div>
                                            </div>
                                        </div>

                                        <div class="row gx-3">
                                            <div class="col-md-6">
                                                <div class="mb-3">
                                                    <label class="small mb-1"
                                                        for="urusanPemerintahanYgDikerjakan">Urusan Pemerintahan yg
                                                        Dikerjakan</label>
                                                    <textarea th:field="*{urusanPemerintahanYgDikerjakan}" class="form-control form-control-md"
                                                        id="urusanPemerintahanYgDikerjakan" type="text"
                                                        placeholder="Masukan Urusan Pemerintahan"  spellcheck="false"></textarea>
                                                </div>
                                            </div>
                                            <div class="col-md-6">
                                                <div class="mb-3">
                                                    <label class="small mb-1" for="jenisDokumen">Jenis Dokumen</label>
                                                    <select class="form-select form-select-sm" th:field="*{jenisDokumen}">
                                                        <option value="">Pilih Jenis Dokumen</option>
                                                        <option th:each="jenisNaskah: ${jenisNaskahList}"
                                                        th:value="${jenisNaskah.id}"
                                                        th:text="${jenisNaskah.nama}"></option>
                                                    </select>    
                                                </div>
                                            </div>
                                        </div>

                                        <div class="row gx-3">
                                            <div class="col-md-6">
                                                <div class="mb-3">
                                                    <label class="small mb-1" for="waktuPelaksanaanDimulai">Waktu
                                                        Pelaksanaan Dimulai</label>
                                                    <input th:field="*{waktuPelaksanaanDimulai}" class="form-control form-control-md"
                                                        id="waktuPelaksanaanDimulai" type="date" />
                                                    <a id="copyTglPenetapan" class="btn btn-sm btn-secondary">Copy dari Tgl Penetapan</a>    
                                                </div>
                                            </div>
                                            <div class="col-md-6">
                                                <div class="mb-3">
                                                    <label class="small mb-1" for="waktuPelaksanaanBerakhir">Waktu
                                                        Pelaksanaan Berakhir</label>
                                                    <input th:field="*{waktuPelaksanaanBerakhir}" class="form-control form-control-md"
                                                        id="waktuPelaksanaanBerakhir" type="date" />
                                                        <a id="1tahun" class="btn btn-sm btn-secondary">1 tahun</a>
                                                        <a id="2tahun" class="btn btn-sm btn-secondary">2 tahun</a>
                                                        <a id="3tahun" class="btn btn-sm btn-secondary">3 tahun</a>
                                                        <a id="4tahun" class="btn btn-sm btn-secondary">4 tahun</a>
                                                        <a id="5tahun" class="btn btn-sm btn-secondary">5 tahun</a>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="mb-3">
                                            <label class="small mb-1" for="jangkaWaktu">Jangka Waktu</label>
                                            <input th:field="*{jangkaWaktuPelaksanaan}" class="form-control form-control-md" id="jangkaWaktu" type="text"
                                                placeholder="Masukkan Jangka Waktu" />
                                        </div>


                                        <div class="mb-3">
                                            <label class="small mb-1" for="pembiayaan">Pembiayaan</label>
                                            <input th:field="*{pembiayaan}" class="form-control form-control-md" id="pembiayaan" type="text"
                                                placeholder="Masukkan Pembiayaan" />
                                        </div>

                                        <div class="mb-3">
                                            <label class="small mb-1" for="linkDokumenKerjaSama">link Dokumen</label>
                                            <textarea th:field="*{linkDokumenKerjaSama}" class="form-control form-control-md" id="linkDokumenKerjaSama"
                                                placeholder="Masukkan Link Dokumen"  spellcheck="false"></textarea>
                                                <a id="copyLink" class="btn btn-sm btn-secondary">Copy</a>
                                        </div>

                                        <div class="mb-3">
                                            <label class="small mb-1" for="linkDokumenKerjaSama">link Dokumen Asli</label>
                                            <textarea th:field="*{keterangan}" class="form-control form-control-md" id="keterangan"
                                                placeholder="Masukkan Link Dokumen"  spellcheck="false"></textarea>
                                                <a id="copyLinkAsli" class="btn btn-sm btn-secondary">Copy</a>
                                        </div>


                                        <!-- TODO : include files here -->
                                        <div class="mb-3">
                                            <label class="small mb-1" for="fileTerkait">File Terkait</label>
                                            <ul id="fileTerkait">
                                                <th:block th:each="child, childStatus : *{dokumen}">
                                                    <input type="hidden" th:field="*{dokumen[__${childStatus.index}__]}" th:id="${'childName_' + childStatus.index}">
                                                    <li><a th:href="@{'/dokumen/download/' + ${child.filename}}">[[${child.filename}]]</a></li>
                                                </th:block>
                                            </ul> 
                                        </div>
                                        <!--input type="hidden" th:field="*{dokumen}"-->
                                        <input type="hidden" th:field="*{keterangan}">
                                        <input type="hidden" th:field="*{keterangan2}">

                                        <div class="mb-3">
                                            <label class="small mb-1" for="keterangan3">Keterangan</label>
                                            <textarea th:field="*{keterangan3}" class="form-control form-control-md" id="linkDokumenKerjaSama"
                                                placeholder="Masukkan Keterangan"  spellcheck="false"></textarea>
                                        </div>

                                        <div class="mb-3">
                                            <label class="small mb-1" for="keterangan4">Keterangan</label>
                                            <textarea th:field="*{keterangan4}" class="form-control form-control-md" id="linkDokumenKerjaSama"
                                                placeholder="Masukkan Keterangan"  spellcheck="false"></textarea>
                                        </div>


                                        <div class="mb-3">
                                            <label class="small mb-1" for="uploadDokumen">Upload Dokumen</label>
                                            <input class="form-control form-control-md col col-sm-5" id="file_1"
                                                name="files" type="file" multiple />
                                            <a type="button" id="add-more-file" class="btn btn-sm btn-primary"
                                                href="#">Tambah file lagi</a>
                                        </div>


                                    </div>
                                    <div class="card-footer text-center">
                                        <button class="btn btn-primary btn-block btn-sm" type="submit">Simpan</button>
                                    </div>
                                </form>

                            </div>
                        </div>
                    </div>

                </div>

            </main>
        </div>
    </div>

    <div th:replace="~{fragments/general.html :: script}"></div>
</body>
<script>
    var counter = 1;

    $(document).ready(function () {
        $("#add-more-file").click(function (e) {
            var fileHtml = '<div class="mb-3" id="file_' + (counter + 1) + '">' +
                '<label for="file" class="small mb-1">&nbsp;</label>' +
                '<input type="file" name="files" multiple class="form-control form-control-md col col-sm-5"' +
                '</div>';
            $("#file_" + counter).after(fileHtml);
            counter = counter + 1;
        });

        $('.autosize').on('input', function() {
            $(this).height(0); // Reset height to avoid stacking
            $(this).height(this.scrollHeight);
        });

        $('#copyTglPenetapan').click( function() {
            $('#waktuPelaksanaanDimulai').val($('#tglPenetapan').val());
        })

        $('#copyLink').click( function() {
            $('#linkDokumenKerjaSama').select();
            document.execCommand("copy");
        })

        $('#copyLinkAsli').click( function() {
            $('#keterangan').select();
            document.execCommand("copy");
        })

        

        $('#1tahun').click( function() {
            var dimulai = new Date($('#waktuPelaksanaanDimulai').val());
            var satuTahun = new Date(dimulai.setFullYear(dimulai.getFullYear() + 1));
            //satuTahun.setDate(satuTahun.getDate() - 1);
            var formattedDate = satuTahun.toISOString().split('T')[0];

            $('#waktuPelaksanaanBerakhir').val(formattedDate);
        })

        $('#2tahun').click( function() {
            var dimulai = new Date($('#waktuPelaksanaanDimulai').val());
            var satuTahun = new Date(dimulai.setFullYear(dimulai.getFullYear() + 2));
            //satuTahun.setDate(satuTahun.getDate() - 1);
            var formattedDate = satuTahun.toISOString().split('T')[0];

            $('#waktuPelaksanaanBerakhir').val(formattedDate);
        })

        $('#3tahun').click( function() {
            var dimulai = new Date($('#waktuPelaksanaanDimulai').val());
            var satuTahun = new Date(dimulai.setFullYear(dimulai.getFullYear() + 3));
            //satuTahun.setDate(satuTahun.getDate() - 1);
            var formattedDate = satuTahun.toISOString().split('T')[0];

            $('#waktuPelaksanaanBerakhir').val(formattedDate);
        })

        $('#4tahun').click( function() {
            var dimulai = new Date($('#waktuPelaksanaanDimulai').val());
            var satuTahun = new Date(dimulai.setFullYear(dimulai.getFullYear() + 4));
            //satuTahun.setDate(satuTahun.getDate() - 1);
            var formattedDate = satuTahun.toISOString().split('T')[0];

            $('#waktuPelaksanaanBerakhir').val(formattedDate);
        })

        $('#5tahun').click( function() {
            var dimulai = new Date($('#waktuPelaksanaanDimulai').val());
            var satuTahun = new Date(dimulai.setFullYear(dimulai.getFullYear() + 5));
            //satuTahun.setDate(satuTahun.getDate() - 1);
            var formattedDate = satuTahun.toISOString().split('T')[0];

            $('#waktuPelaksanaanBerakhir').val(formattedDate);
        })

        $('#opd').select2({maximumSelectionLength: 15, allowClear: true, placeholder: 'Masukkan pilihan'});
        $('#rumpunopd').select2({maximumSelectionLength: 15, allowClear: true, placeholder: 'Masukkan pilihan'});
        


    });
</script>

</html>
