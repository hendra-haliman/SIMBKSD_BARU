<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/general.html :: header('Lihat Kolaborasi')}"></head>

<body class="sb-nav-fixed">
    <nav th:replace="~{fragments/general.html :: navigation}"></nav>
    <div id="layoutSidenav">
        <div id="layoutSidenav_nav" th:include="~{fragments/general.html :: layoutSidenav_nav}"></div>

        <div id="layoutSidenav_content">
            <main>
                <!-- Main page content-->
                <div class="container-fluid px-4 py-5 mt-n10">
                    <div class="card my-4">
                        <div class="card-header">Detail Kolaborasi</div>
                        <div class="card-body">
                            <table class="table table-bordered">
                                <thead>

                                </thead>
                                <tbody>
                                    <tr>
                                        <td style="width: 200px;">Tahun</td>
                                        <td  th:text="${kolaborasi.tahun}"></td>
                                    </tr>
                                    <tr>
                                        <td>Mitra Kerja Sama</td>
                                        <td th:text="${kolaborasi.mitraKerjaSama}"></td>
                                    </tr>
                                    <tr>
                                        <td>Nama dan Tempat Kejadian</td>
                                        <td th:text="${kolaborasi.namaDanTempatKejadian}"></td>
                                    </tr>
                                    <tr>
                                        <td>Waktu</td>
                                        <td th:text="${kolaborasi.waktu}"></td>
                                    </tr>
                                    <tr>
                                        <td>Bagian</td>
                                        <td></td>
                                    </tr>
                                    <tr th:each="bagian: ${kolaborasi.bagian}">
                                        <td></td>
                                        <td th:text="${bagian.singkatan}"></td>
                                    </tr>
                                    <tr>
                                        <td>Keterangan</td>
                                        <td th:text="${kolaborasi.keterangan}"></td>
                                    </tr>

                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>

            </main>
        </div>
    </div>

    <div th:replace="~{fragments/general.html :: script}"></div>    
</body>
<script>
    $(document).ready(function() {
        
    });
</script>
</html>
