<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/general.html :: header('Tambah Dokumen Kolaborasi')}"></head>

<body class="nav-fixed">
    <nav th:replace="~{fragments/general.html :: navigation}"></nav>
    <div id="layoutSidenav">
        <div id="layoutSidenav_nav" th:include="~{fragments/general.html :: layoutSidenav_nav}"></div>

        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4 py-5 mt-auto">
                    <div class="row justify-content-center">
                        <div class="col-lg-7">
                            <div class="card shadow-lg border-0 rounded-lg mt-3">
                                <form th:action="@{/kolaborasi/saveNew}" method="post" th:object="${kolaborasi}">

                                    <div class="card-header justify-content-center">
                                        <h4 class="fw-light my-2">Tambah Dokumen Kolaborasi Baru</h4>
                                    </div>
                                    <div class="card-body">

                                        <div class="mb-3">
                                            <label class="small mb-1" for="tahun">Tahun</label>
                                            <input th:field="*{tahun}" class="form-control form-control-sm"
                                            id="tahun" type="text"
                                            placeholder="Masukan tahun" />
                                        </div>

                                        <div class="mb-3">
                                            <label class="small mb-1" for="mitraKerjaSama">Mitra Kerja Sama</label>
                                            <textarea th:field="*{mitraKerjaSama}" class="form-control form-control-sm" id="mitraKerjaSama"
                                                placeholder="Masukkan Mitra Kerja Sama" spellcheck="false"></textarea>
                                        </div>

                                        <div class="mb-3">
                                            <label class="small mb-1" for="namaTempatKejadian">Nama dan Tempat Kejadian</label>
                                            <textarea th:field="*{namaDanTempatKejadian}" class="form-control form-control-sm" id="namaTempatKejadian"
                                                placeholder="Masukkan Nama dan Tempat Kejadian" spellcheck="false"></textarea>
                                        </div>

                                        <div class="mb-3">
                                            <label class="small mb-1" for="judulDokumenPerjanjian">Waktu</label>
                                            <textarea th:field="*{waktu}" class="form-control form-control-sm" id="waktu"
                                                placeholder="Masukkan Waktu" spellcheck="false"></textarea>
                                        </div>

                                        <div class="mb-3">
                                            <label class="small mb-1" for="bagian">Bagian</label>
                                            <select class="form-select form-select-sm" th:field="*{bagian}" name="bagian[]" multiple="multiple">
                                                <option value="">Masukkan pilihan</option>
                                                <option th:each="bagian: ${bagianList}"
                                                th:value="${bagian.id}"
                                                th:text="${bagian.nama}"></option>
                                            </select>    
                                        </div>

                                        <div class="mb-3">
                                            <label class="small mb-1" for="keterangan">Keterangan</label>
                                            <textarea th:field="*{keterangan}" class="form-control form-control-sm" id="keterangan"
                                                placeholder="Masukkan Keterangan"  spellcheck="false"/>
                                        </div>


                                    </div>
                                    <div class="card-footer text-center">
                                        <button class="btn btn-primary btn-block" type="submit">Simpan</button>
                                    </div>
                                </form>

                            </div>
                        </div>
                    </div>

                </div>

            </main>
        </div>
    </div>

    <div th:replace="~{fragments/general.html :: script}"></div>
</body>
<script>
    var counter = 1;

    $(document).ready(function () {
        $('#bagian').select2({maximumSelectionLength: 15, allowClear: true, placeholder: 'Masukkan pilihan'});

        $('#tahun').datepicker({
                format: "yyyy",
                viewMode: "years", 
                minViewMode: "years",
                autoclose: true,
                clearBtn: true
            })

    });
</script>

</html>
