<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/general.html :: header('Tambah Dokumen Kolaborasi')}"></head>

<body>
    kolab dashboard
    <img th:src="'data:image/png;base64,' + ${base64Image}" />
    <button onClick="loadImg()">Load captcha</button>
    <img id="myimg" th:src="'data:image/png;base64,' + ${base64Image}" />

    <div th:replace="~{fragments/general.html :: script}"></div>

    <script>
        var token = $("meta[name='_csrf']").attr("content");
        var header = $("meta[name='_csrf_header']").attr("content");

        function loadImg() {
            $.ajax({
                url: contextPath + 'captcha/getCaptcha',
                method: 'GET',
                "headers": {
                        [header]: token  // Include the CSRF token in the request header
                    },
                success: function(base64Image) {
                    if (base64Image) {
                        $('#myimg').attr('src', 'data:image/png;base64,' + base64Image);
                    } else {
                        alert('Masalah loading captcha');
                    }
                },
                error: function() {
                    alert('error mendapatkan captcha')
                } 
            });
        }
    </script>

</body>

</html>
