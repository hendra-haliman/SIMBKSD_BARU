<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/general.html :: header('Lihat Dokumen KLN')}"></head>

<body class="sb-nav-fixed">
    <nav th:replace="~{fragments/general.html :: navigation}"></nav>
    <div id="layoutSidenav">
        <div id="layoutSidenav_nav" th:include="~{fragments/general.html :: layoutSidenav_nav}"></div>

        <div id="layoutSidenav_content" class="background01">
            <main>
                <!-- Main page content-->
                <div class="container-fluid px-4 py-5 mt-n10">
                    <div class="card my-4">
                        <div class="card-header">Detail Dokumen Kerja Sama Luar Negeri</div>
                        <div class="card-body">
                            <table class="table table-bordered table-sm table-condensed">
                                <thead>

                                </thead>
                                <tbody>
                                    <tr>
                                        <td>Tahun</td>
                                        <td th:text="${dokumen.tahun}"></td>
                                    </tr>
                                    <tr>
                                        <td>Subjek</td>
                                        <td th:text="${dokumen.objek}"></td>
                                    </tr>
                                    <tr>
                                        <td>Mitra</td>
                                        <td th:text="${dokumen.mitra}"></td>
                                    </tr>
                                    <tr>
                                        <td>Cakupan</td>
                                        <td th:text="${dokumen.cakupan}"></td>
                                    </tr>
                                    <tr>
                                        <td>Dasar</td>
                                        <td th:text="${dokumen.dasar}"></td>
                                    </tr>
                                    <tr>
                                        <td>SKPD/Unit Terkait</td>
                                        <td th:text="${dokumen.skpdUnitTerkait}"></td>
                                    </tr>

                                    <tr>
                                        <td>Pelaksanaan</td>
                                        <td th:text="${dokumen.pelaksanaan}"></td>
                                    </tr>
                                    <tr>
                                        <td>Kendala</td>
                                        <td th:text="${dokumen.kendala}"></td>
                                    </tr>
                                    <tr>
                                        <td>Tindak Lanjut</td>
                                        <td th:text="${dokumen.tindakLanjut}"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>

            </main>
        </div>
    </div>

    <div th:replace="~{fragments/general.html :: script}"></div>    
</body>
<script>
    $(document).ready(function() {
        
    });
</script>
</html>
