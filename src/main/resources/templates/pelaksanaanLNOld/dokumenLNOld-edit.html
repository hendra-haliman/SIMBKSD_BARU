<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/general.html :: header('Edit Dokumen KLN (2020 & 2021)')}"></head>

<body class="sb-nav-fixed">
    <nav th:replace="~{fragments/general.html :: navigation}"></nav>
    <div id="layoutSidenav">
        <div id="layoutSidenav_nav" th:include="~{fragments/general.html :: layoutSidenav_nav}"></div>

        <div id="layoutSidenav_content" class="background01">
            <main>
                <div class="container-fluid px-4 pt-5 mt-auto">
                    <div class="row justify-content-center">
                        <div class="col-lg-12">
                            <div class="card shadow-lg border-0 rounded-lg mt-3">
                                <form th:action="@{/dokumen_luar_negeri_old/saveEdit}" method="post" th:object="${dokumenLNOld}">
                                    <input type="hidden" th:field="*{id}"/>

                                    <div class="card-header justify-content-center">
                                        <h4 class="fw-light my-2">Edit Dokumen Kerja Sama Luar Negeri (2020/2021)</h4>
                                    </div>
                                    <div class="card-body">
                                        <div class="mb-3 row">
                                            <div class="col-md-1">
                                                <label class="small mb-1" for="tahun">Tahun</label>
                                                <input th:field="*{tahun}" class="form-control form-control-sm"
                                                    id="tahun" type="text"
                                                    placeholder="Masukan tahun" readonly/>    
                                            </div>
                                            <div class="col-md-11">
                                                <label class="small mb-1" for="objek">Objek</label>
                                                <textarea th:field="*{objek}" class="form-control form-control-md" id="objek"
                                                    placeholder="Masukkan Objek" spellcheck="false"></textarea>    
                                            </div>
                                        </div>

                                        <div class="mb-3 row">
                                            <div class="col-md-6">
                                                <label class="small mb-1" for="mitra">Mitra</label>
                                                <textarea th:field="*{mitra}" class="form-control form-control-md" id="mitra"
                                                    placeholder="Masukkan Mitra" spellcheck="false"></textarea>    
                                            </div>
                                            <div class="col-md-6">
                                                <label class="small mb-1" for="cakupan">Cakupan</label>
                                                <textarea th:field="*{cakupan}" class="form-control form-control-md" id="cakupan"
                                                    placeholder="Masukkan Cakupan" spellcheck="false"></textarea>    
                                            </div>
                                        </div>

                                        <div class="mb-3 row">
                                            <div class="col-md-6">
                                                <label class="small mb-1" for="dasar">Dasar</label>
                                                <textarea th:field="*{dasar}" class="form-control form-control-md" id="dasar"
                                                    placeholder="Masukkan Dasar" spellcheck="false"></textarea>    
                                            </div>
                                            <div class="col-md-6">
                                                <label class="small mb-1" for="skpdUnitTerkait">SKPD/Unit Terkait</label>
                                                <textarea th:field="*{skpdUnitTerkait}" class="form-control form-control-md" id="skpdUnitTerkait"
                                                    placeholder="Masukkan SKPD/Unit Terkait" spellcheck="false"></textarea>    
                                            </div>
                                        </div>

                                        <div class="mb-3 row">
                                            <div class="col-md-6">
                                                <label class="small mb-1" for="waktu">Waktu</label>
                                                <textarea th:field="*{waktu}" class="form-control form-control-md" id="waktu"
                                                    placeholder="Masukkan Waktu" spellcheck="false"></textarea>    
                                            </div>
                                            <div class="col-md-6">
                                                <label class="small mb-1" for="pelaksanaan">Pelaksanaan</label>
                                                <textarea th:field="*{pelaksanaan}" class="form-control form-control-md" id="pelaksanaan"
                                                    placeholder="Masukkan Pelaksanaan" spellcheck="false"></textarea>    
                                            </div>
                                        </div>

                                        <div class="mb-3 row">
                                            <div class="col-md-6">
                                                <label class="small mb-1" for="kendala">Kendala</label>
                                                <textarea th:field="*{kendala}" class="form-control form-control-md" id="kendala"
                                                    placeholder="Masukkan Kendala" spellcheck="false"></textarea>    
                                            </div>
                                            <div class="col-md-6">
                                                <label class="small mb-1" for="tindakLanjut">Tindak Lanjut</label>
                                                <textarea th:field="*{tindakLanjut}" class="form-control form-control-md" id="tindakLanjut"
                                                    placeholder="Masukkan Tindak Lanjut" spellcheck="false"></textarea>    
                                            </div>
                                        </div>

                                    </div>
                                    <div class="card-footer text-center">
                                        <button class="btn btn-primary btn-block" type="submit">Simpan</button>
                                    </div>
                                </form>

                            </div>
                        </div>
                    </div>

                </div>

            </main>
        </div>
    </div>

    <div th:replace="~{fragments/general.html :: script}"></div>
    <script>
        $(document).ready(function () {
            $("#tahun").datepicker({
                format: "yyyy",
                viewMode: "years", 
                minViewMode: "years",
                autoclose: true,
                clearBtn: false,
                orientation: "bottom"
            });
    
        });
        </script>
    
</body>

</html>
