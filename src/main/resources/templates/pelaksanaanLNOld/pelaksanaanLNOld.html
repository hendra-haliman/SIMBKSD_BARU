    <script th:inline="javascript">
        var isAdmin = /*[[${#authorization.expression('hasRole(''ADMIN'')')}]]*/ '';
        var isSTAFF_CONTRIBUTOR = /*[[${#authorization.expression('hasRole(''STAFF_CONTRIBUTOR'')')}]]*/ '';
    </script>

    <script>
        var id_to_delete = 0;

        $(document).ready(function () {

            $('#addAll').click(function() {
                var $select = $('#filterTableDefinition');
                $select.find('option').prop('selected', true);
                $select.trigger('change'); 
            });

            $('#removeAll').click(function() {
                var $select = $('#filterTableDefinition');
                $select.find('option').prop('selected', false);
                $select.trigger('change'); 
            });

            $("#logout").on("click", function (e) {
                $("#logout-form").submit();

            });

            var token = $("meta[name='_csrf']").attr("content");
            var header = $("meta[name='_csrf_header']").attr("content");

            var docTable = $("#dokTable").dataTable({
                "select": true,
                "processing": true,
                "serverSide": true,
                "responsive": true,
                "ordering": false,
                "searchDelay": 1000,
                "initComplete": function () {
                    var searchInput = $('#dt-search-0');
                    searchInput.css('width', '400px'); 
                },
                "ajax": {
                    "url": contextPath + "dokumen_luar_negeri_old/list",
                    "type": "POST",
                    "dataType": "json",
                    "cache": "no-cache",
                    "headers": {
                        [header]: token  
                    },
                    "contentType": "application/json",
                    "data": function(d) {
                        var filterTahun = $('#yearpicker').val();                       
                        d.filterTahun = filterTahun;

                        return JSON.stringify(d);
                    },
                    "dataSrc": function (json) {
                        console.log(json);
                        if (json.redirect) {
                            window.location.href = json.location;
                        }
                        return json.data;
                    },
                    "error": function (xhr, error, thrown) {
                        if (xhr.status === 401) {
                            window.location.href = contextPath + "logout"; 
                        }
                    }
                },

                "columns": [
                    {
                        "name": "check",
                        "targets": 0,
                        "data": null,
                        "className": "dt-body-center",
                        "render": function (data, type, row, meta) {
                            return "<input type='checkbox'>";
                        }
                    },
                    {
                        "name": "nomor",
                        "data": null,
                        "targets": 1,
                        "render": function (data, type, row, meta) {
                            return meta.row + meta.settings._iDisplayStart + 1
                        }
                    },
                    {
                        "name": "tahun",
                        "data": "tahun"
                    },
                    {
                        "name": "objek",
                        "data": "objek"
                    },
                    {
                        "name": "mitra",
                        "data": "mitra"
                    },
                    {
                        "name": "cakupan",
                        "data": "cakupan"
                    },
                    {
                        "name": "dasar", 
                        "data": "dasar" 
                    },
                    {
                        "name": "skpd",
                        "data": "skpdUnitTerkait",
                    },
                    {
                        "name": "waktu",
                        "data": "waktu",
                    },
                    { 
                        "name": "pelaksanaan",
                        "data": "pelaksanaan"

                    },
                    {
                        "name": "kendala",
                        "data": "kendala"
                    },
                    {
                        "name": "tindakLanjut",
                        "data": "tindakLanjut",
                    },
                    {
                        "name": "action",
                        "data": null,
                        "responsivePriority": 2,
                        "className": "text-center",
                        "width": "130",
                        "render": function (data, type, row, meta) {
                            var actions = "<a class='btn btn-sm btn-success mb-sm-1 inline-link ' href='" + contextPath + "dokumen_luar_negeri_old/view/" + row.id + "' data-bs-toggle='tooltip' data-bs-placement='top' title='Lihat'><svg class='myicon'><use xlink:href='#binoculars'></use></svg><span class='ms-sm-2'>Lihat</span></a>";

                            if (isSTAFF_CONTRIBUTOR || isAdmin) {
                                actions += "<a class='btn btn-sm btn-warning mb-sm-1 inline-link ' href='" + contextPath + "dokumen_luar_negeri_old/edit/" + row.id + "' data-bs-toggle='tooltip' data-bs-placement='top' title='Edit'><svg class='myicon'><use xlink:href='#pencil'></use></svg> <span class='ms-sm-2'>Rubah</span></a>";
                            }

                            if (isAdmin) {
                                actions += "<a class='btn btn-sm btn-danger mb-sm-1 inline-link ' id='delete'  onclick='showDeleteConfirmation(\"" + row.objek + "\"," + row.id + ")' href='#' data-bs-toggle='tooltip' data-bs-placement='top' title='Hapus'><svg class='myicon'><use xlink:href='#trash-can'></use></svg> <span class='ms-sm-2'>Hapus</span></a>";
                            }

                            return actions;
                        }
                    }
                ],
                "layout": {
                    "top2Start": {
                        "buttons": [
                            {
                                text: '<i class="fa-solid fa-plus"></i> Tambah Dokumen',
                                className: 'btn btn-sm btn-tambah',
                                action: function (e, dt, node, config) {
                                    window.location.href = contextPath + "dokumen_luar_negeri_old/add";
                                }
                            },
                            {
                                text: '<i class="fa-solid fa-right-long"></i> Export Excel',
                                className: 'btn btn-sm btn-excel',
                                action: function (e, dt, button, config) {
                                    var data = {};
                                    $.extend(data, dt.ajax.params());
                                    var params = dt.ajax.params();
                                    var searchValue = params.search.value;
                                    var flattened = flattenJson(data);
                                    console.log(params);

                                    const url = contextPath + "dokumen_luar_negeri_old/exportExcel";
                                    
                                    fetch(url, {
                                        method : "POST",
                                        body: params,
                                        headers: { "Content-Type": "application/json; charset=UTF-8", [header]: token }
                                    }).then(response => response.blob())
                                    .then(blob => {
                                        const filename = 'exportKLN_OLD.xlsx'; 
                                        const url = window.URL.createObjectURL(blob);
                                        const link = document.createElement('a');
                                        link.href = url;
                                        link.download = filename;
                                        link.click();
                                        window.URL.revokeObjectURL(url); 
                                        })
                                    .catch(error => console.error(error));
                                }
                            },
                            {
                                "text": "Show/Hide Filter",
                                className: 'btn btn-sm btn-filter',
                                "action": function (e, dt, button, config) {
                                    $('#filter').toggle(function () {
                                        $('#panel').animate({
                                            height: "150",
                                            padding: "20px 0",
                                            backgroundColor: '#000000',
                                            opacity: .8
                                        }, 500);
                                    },
                                        function () {
                                            $('#panel').animate({
                                                height: "0",
                                                padding: "0px 0",
                                                opacity: .2
                                            }, 500);
                                        });
                                }
                            },
                            {
                                extend: 'print',
                                text: 'Print',
                                className: 'btn btn-sm btn-print',
                                autoPrint: true,
                                exportOptions: {
                                    modifier: {
                                        selected: true // Print only selected rows
                                    }
                                }
                            }

                        ]
                    }
                },
                "oLanguage": {
                    "sInfo": "Menampilkan <strong>_START_</strong> sampai <strong>_END_</strong> , total: <strong>_TOTAL_</strong> items"
                },
                "language": {
                    "lengthMenu": "_MENU_ &nbsp;records per halaman",
                    "emptyTable": "Maaf, tidak ada data tersedia."
                }
            });

            $('.js-example-basic-multiple').select2({maximumSelectionLength: 15, allowClear: true, placeholder: 'Masukkan pilihan'});

            $("#yearpicker").datepicker({
                format: "yyyy",
                viewMode: "years", 
                minViewMode: "years",
                autoclose: true,
                clearBtn: true
            });

            $('#yearpicker').datepicker()
            .on('change', function(e) {
                var value = $('#yearpicker').val();
                docTable.api().draw();
            });
            
            $.extend($.fn.dataTableExt.oStdClasses, {
                "sFilterInput": "red form-control form-control-md", // Replace with your desired class name
            });


             // Handle click on "Select all" control
             $('#select-all').on('click', function(){
                // Get all rows with search applied
                var rows = docTable.api().rows({ 'search': 'applied' }).nodes();
                // Check/uncheck checkboxes for all rows in the table
                $('input[type="checkbox"]', rows).prop('checked', this.checked);
            });

            // Handle checkbox change event
            $('#dokTable tbody').on('change', 'input[type="checkbox"]', function(){
                // If checkbox is not checked
                if(!this.checked){
                   var el = $('#select-all').get(0);
                   // If "Select all" control is checked and has 'indeterminate' property
                   if(el && el.checked && ('indeterminate' in el)){
                      el.indeterminate = true;
                   }
                }
            });

        });

        function showDeleteConfirmation(title, id) { 
            id_to_delete = id; 
            $('#alertDokTitle').text(title);
            $('#deleteConfirmationModal').modal('show');
        }

        function flattenJson(data, name, flattened) {
            if (!flattened) {
                flattened = {};
            }
            if (!name) {
                name = '';
            }
            if ($.isPlainObject(data) || Array.isArray(data)) {
                $.each(data, function (idx, val) {
                    if (name === '') {
                        flattenJson(val, idx, flattened);
                    }
                    else {
                        flattenJson(val, name + '[' + idx.toString() + ']', flattened);
                    }
                });
            }
            else {
                flattened[name] = data;
            }
            return flattened;
        }

        function confirmDelete() {
            window.location.href = contextPath + "dokumen_luar_negeri_old/delete/" + id_to_delete;
        }

    </script>

    <script th:if="${year} != null">
        $(document).ready(function () {
            $('#yearpicker').val([[${year}]]);
            $('#yearpicker').trigger('change');
        });
    </script>
