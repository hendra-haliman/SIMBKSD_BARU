    <nav th:replace="~{fragments/general.html :: navigation}"></nav>
    
    <div id="layoutSidenav">
        <div id="layoutSidenav_nav" th:include="~{fragments/general.html :: layoutSidenav_nav}"></div>

        <div id="layoutSidenav_content" class="background01">
            <main>
                
                <header
                    th:replace="~{fragments/content-header.html :: content-header('Pelaksanaan Luar Negeri','','')}">
                </header>

                <!-- Main page content-->
                <div class="container-fluid px-4 mt-n10">

                    <div th:if="${success_msg} != null" th:text="${success_msg}" class="alert alert-success" role="alert">
                    </div>

                    <div class="card my-4">
                        <!--div class="card-header">Dokumen Kerja Sama KLN</div-->
                        <div class="card-body">

                            <!-- FILTER -->
                            <div class="filter" id="filter">
                                <!-- Tgl Penetapan -->
                                <div class="d-flex flex-row align-items-center mb-1">
                                    <label for="minDate" class="me-2 col-form-label" style="width: 280px;">Filter Tgl Penetapan dari tanggal</label><input id="minDate" class="form-control form-control-sm" style="width: 150px;" type="date"/>
                                    <label for="maxDate"  class="me-2 col-form-label" style="margin-left: 10px;">s/d tanggal</label><input class="form-control form-control-sm me-2" id="maxDate" style="width: 150px;" type="date"/>
                                    <label for="yearpicker"  class="me-2 col-form-label">Tahun</label> <input type="text" id="yearpicker" class="form-control form-control-sm" style="width:100px;"/>
                                </div>

                                <!-- Tgl Berakhir -->
                                <div class="d-flex flex-row align-items-center mb-1">
                                    <label for="minTglBerakhir" class="me-2 col-form-label" style="width: 280px;">Filter Tgl Berakhir dari tanggal</label><input id="minTglBerakhir" class="form-control form-control-sm" style="width: 150px;" type="date"/>
                                    <label for="maxTglBerakhir"  class="me-2 col-form-label" style="margin-left: 10px;">s/d tanggal</label><input class="form-control form-control-sm me-2" id="maxTglBerakhir" style="width: 150px;" type="date"/>
                                    <label for="yearTglBerakhirpicker"  class="me-2 col-form-label">Tahun</label> <input type="text" id="yearTglBerakhirpicker" class="form-control form-control-sm" style="width:100px;"/>
                                    <label for="filterNullTglBerakhir"class="me-2 col-form-label" style="margin-left: 10px;">Empty Tgl Berakhir</label><input type="checkbox" name="filterNullTglBerakhir" id="filterNullTglBerakhir" checked/>
                                </div>
                            </div>
                            <!-- END OF FILTER -->

                            <table id="dokTable"
                                class="table table-bordered table-striped table-responsive table-compact table-sm"
                                style="width: 100%; border-bottom-width: 1px;">
                                <thead>
                                    <tr>
                                        <th class="text-center"><input type="checkbox" id="select-all"></th>
                                        <th class="text-center">No</th>
                                        <th class="text-center">Tahun</th>
                                        <th class="text-center">Subjek</th>
                                        <th class="text-center">Tgl</th>
                                        <th class="text-center">Judul Dokumen Perjanjian</th>
                                        <th class="text-center">Tgl Dimulai</th>
                                        <th class="text-center">Tgl Berakhir</th>
                                        <th class="text-center">Keterangan</th>
                                        <th class="text-center">Link Dokumen Perjanjian</th>
                                        <th class="text-center">File Terkait</th>
                                        <th class="text-center">Penanggung Jawab Tertanda Tangan</th>
                                        <th class="text-center">Jenis Dokumen Perjanjian</th>
                                        <th class="text-center">Action</th>
                                    </tr>
                                </thead>
                                <tbody></tbody>

                            </table>
                        </div>
                    </div>

                    <!--Confirmation Dialog sebelum delete-->
                    <div class="modal fade" id="deleteConfirmationModal" tabindex="-1" role="dialog"
                        aria-labelledby="deleteConfirmationModalLabel" aria-hidden="true">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title" id="confirmationModalLabel">Konfirmasi</h5>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal"
                                        aria-label="Close"></button>
                                </div>
                                <div class="modal-body">
                                    Anda yakin untuk menghapus dokumen perjanjian <span id="alertDokTitle" style="color:red;"></span> ?
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary"
                                        data-bs-dismiss="modal">Batal</button>
                                    <button type="button" class="btn btn-primary" id="confirmAction" onclick="confirmDelete()">Ya</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Table Column Setup Dialog -->
                    <div class="modal fade" id="setupConfirmationModal" tabindex="-1" role="dialog"
                        aria-labelledby="setupConfirmationModalLabel" aria-hidden="true">
                        <div class="modal-dialog modal-lg">
                            <div class="modal-content">
                                <!--form th:object="${pemakai}" method="post" action="@{/pemakai/save}"-->
                                    <div class="modal-header">
                                        <h5 class="modal-title" id="confirmationModalLabel">Table Column Setup</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"
                                            aria-label="Close"></button>
                                    </div>
                                    <div class="modal-body">
                                        
                                        <div class="row">
                                            <label for="filterTableDefinition" class="me-2 col-form-label">Pilih Kolum yang ingin ditampilkan</label>
                                            <br>
                                            <select id="filterTableDefinition" class="table-multiple col-md-12" name="tableDefinition[]" multiple="multiple"  th:field="${pemakai.tableDefinition}">
                                                <option th:each="definition : ${tableDef}"
                                                        th:value="${definition.id}"
                                                        th:text="${definition.namaColumn}"></option>
                                            </select>
                                        </div>    

                                        <div class="row">
                                            <div class="col col-md-2"><button id="addAll" class="btn btn-sm btn-primary">Add All</button></div>
                                            <div class="col col-md-2"><button id="removeAll" class="btn btn-sm btn-secondary">Remove All</button></div>
                                        </div>                                       
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary"
                                            data-bs-dismiss="modal">Batal</button>
                                        <button type="button" class="btn btn-primary" id="confirSetupAction">Ok</button>
                                    </div>
                                <!--/form-->
                            </div>
                        </div>
                    </div>

                </div>
            </main>
            <footer th:replace="~{fragments/general.html :: footer}"></footer>
        </div>
    </div>

    <div th:include="~{fragments/general.html :: script}"></div>
    <script>
        let currentYear = new Date().getFullYear();
        let currStart = currentYear + "-01-01";
        let currFirst = currentYear + "-07-01";
        let currEnd = currentYear + "-12-31";
    
        let nextYear = currentYear + 1;
        let nextStart = nextYear + "-01-01";
        let nextFirst = nextYear + "-07-01";
        let nextEnd = nextYear + "-12-31";
    
     </script>
    
     <script th:if="${mode} == 'firstSemesterTahunIni'">
        $(document).ready(function () {
            $('#minTglBerakhir').attr('value', currStart);
            $('#maxTglBerakhir').attr('value', currFirst);
            $('#filterNullTglBerakhir').prop('checked', false);
            docTable.api().draw();
        });
     </script>
     <script th:if="${mode} == 'tahunIni'">
        $(document).ready(function () {
            $('#minTglBerakhir').attr('value', currStart);
            $('#maxTglBerakhir').attr('value', currEnd);
            $('#filterNullTglBerakhir').prop('checked', false);
            docTable.api().draw();
        });
     </script>
     <script th:if="${mode} == 'firstSemesterTahunDepan'">
        $(document).ready(function () {
            debugger;
            $('#minTglBerakhir').val(nextStart);
            $('#maxTglBerakhir').val(nextFirst);
            $('#filterNullTglBerakhir').prop('checked', false);
            docTable.api().draw();
        });
     </script>
     <script th:if="${mode} == 'tahunDepan'">
        $(document).ready(function () {
            $('#minTglBerakhir').attr('value', nextStart);
            $('#maxTglBerakhir').attr('value', nextEnd);
            $('#filterNullTglBerakhir').prop('checked', false);
            docTable.api().draw();
        });
     </script>
    
    <script th:inline="javascript">
        var jsonDefsStr = /*[[${jsonDefs}]]*/ 'default';
        var jsonDefs = JSON.parse(jsonDefsStr);
    </script>

    <script th:inline="javascript">
        var isAdmin = /*[[${#authorization.expression('hasRole(''ADMIN'')')}]]*/ '';
        var isSTAFF_CONTRIBUTOR = /*[[${#authorization.expression('hasRole(''STAFF_CONTRIBUTOR'')')}]]*/ '';
    </script>

    <script>
        var id_to_delete = 0;

        $(document).ready(function () {
            $('#confirSetupAction').click(function () {
                var selection = $('#filterTableDefinition').select2('data');
                console.log(selection);
                docTable.api().columns().visible(false);
                for (let i = 0; i < selection.length; i++) {
                    let column = docTable.api().column(selection[i].text + ":name");
                    column.visible(true);
                }

                $('#setupConfirmationModal').modal('hide');

                var selectedValue = $('#filterTableDefinition').val(); 
                var dataToSend = JSON.stringify({ selectedOption: selectedValue.map(Number) });

                console.log($('#filterTableDefinition').val());
                console.log(selection);

                $.ajax({
                    url: contextPath + 'dokumen_luar_negeri/saveTableOption', 
                    type: 'POST', 
                    contentType: 'application/json', 
                    //dataType: 'json',
                    data: dataToSend    
                    ,
                    success: function(response) {
                        console.log('Success:', response);
                    },
                    error: function(xhr, status, error) {
                        console.error('Error:', error);
                    }
                });                
            });


            $('#addAll').click(function() {
                var $select = $('#filterTableDefinition');
                $select.find('option').prop('selected', true);
                $select.trigger('change'); // Notify Select2 to update results
            });

            $('#removeAll').click(function() {
                var $select = $('#filterTableDefinition');
                $select.find('option').prop('selected', false);
                $select.trigger('change'); // Notify Select2 to update results
            });

            $('#setupConfirmationModal').on('shown.bs.modal', function () {
                $('#filterTableDefinition').select2({
                dropdownParent: $('#setupConfirmationModal'),
                allowClear: true, placeholder: 'Masukkan pilihan'
                });
            });


            $('#setupConfirmationModal').modal({
                backdrop: 'static',  // Disable closing by clicking outside the modal
                keyboard: false      // Disable closing by pressing the ESC key
            });
          

            $("#logout").on("click", function (e) {
                $("#logout-form").submit();

            });

            var token = $("meta[name='_csrf']").attr("content");
            var header = $("meta[name='_csrf_header']").attr("content");

            var docTable = $("#dokTable").dataTable({
                "select": true,
                "processing": true,
                "serverSide": true,
                "responsive": true,
                "ordering": false,
                "searchDelay": 1000,
                "initComplete": function () {
                    var searchInput = $('#dt-search-0');
                    searchInput.css('width', '400px'); // Adjust the width as needed
                },
                "ajax": {
                    "url": contextPath + "dokumen_luar_negeri/list",
                    "type": "POST",
                    "dataType": "json",
                    "cache": "no-cache",
                    "headers": {
                        [header]: token  // Include the CSRF token in the request header
                    },
                    "contentType": "application/json",
                    "data": function(d) {
                        var minDate = $('#minDate').val();
                        var maxDate = $('#maxDate').val();
                        var filterTahun = $('#yearpicker').val();

                        var minTglBerakhir = $('#minTglBerakhir').val();
                        var maxTglBerakhir = $('#maxTglBerakhir').val();

                        var filterNullTglBerakhir = $('#filterNullTglBerakhir').is(':checked');

                       
                        d.filterStartDate = minDate;
                        d.filterEndDate = maxDate;
                        d.filterTahun = filterTahun;

                        d.filterTglBerakhirStartDate = minTglBerakhir;
                        d.filterTglBerakhirEndDate = maxTglBerakhir;
                        d.includeNullTglBerakhir = filterNullTglBerakhir;


                        return JSON.stringify(d);
                    },
                    "dataSrc": function (json) {
                        console.log(json);
                        if (json.redirect) {
                            window.location.href = json.location;
                        }
                        return json.data;
                    },
                    "error": function (xhr, error, thrown) {
                        if (xhr.status === 401) {
                            window.location.href = contextPath + "logout"; // Redirect to login page
                        }
                    }
                },

                "columns": [
                    {
                        "name": "check",
                        "targets": 0,
                        "data": null,
                        "className": "dt-body-center",
                        "render": function (data, type, row, meta) {
                            return "<input type='checkbox'>";
                        }
                    },
                    {
                        "name": "nomor",
                        "data": null,
                        "targets": 1,
                        "render": function (data, type, row, meta) {
                            return meta.row + meta.settings._iDisplayStart + 1
                        }
                    },
                    {
                        "name": "tahun",
                        "data": "tahun"
                    },
                    {
                        "name": "subjek",
                        "data": "subjek"
                    },
                    {
                        "name": "tgl",
                        "data": "tgl",
                        "type": "date",
                        "render": function (data, type, row, meta) {
                            const theDate = new Date(data);
                            const options = { year: 'numeric', month: '2-digit', day: '2-digit' };
                            const formattedDate2 = theDate.toLocaleDateString('id-ID', options);
                            return formattedDate2;
                        }
                    },
                    {
                        "name": "judul", 
                        "data": "judulDokumen" 
                    },
                    {
                        "name": "tgl_dimulai",
                        "data": "tglDimulai",
                        "type": "date",
                        "render": function (data, type, row, meta) {
                            if (data==null) {
                                return "";
                            }

                            const theDate = new Date(data);
                            const options = { year: 'numeric', month: '2-digit', day: '2-digit' };
                            const formattedDate2 = theDate.toLocaleDateString('id-ID', options);
                            return formattedDate2;
                        }
                    },
                    {
                        "name": "tgl_berakhir",
                        "data": "tglBerakhir",
                        "type": "date",
                        "render": function (data, type, row, meta) {
                            if (data==null) {
                                return "";
                            }

                            const theDate = new Date(data);
                            const options = { year: 'numeric', month: '2-digit', day: '2-digit' };
                            const formattedDate2 = theDate.toLocaleDateString('id-ID', options);
                            return formattedDate2;
                        }
                    },
                    { 
                        "name": "keterangan",
                        "data": "keterangan"

                    },
                    {
                        "name": "link",
                        "data": "linkDokumen"
                    },
                    {
                        "name": "file_terkait",
                        "data": "dokumen",
                        "render": function(data, type, row, meta) {
                            var result = "";

                            if (data.length > 0) {
                                for (let i = 0; i < data.length; i++) {
                                    if (i>0) {
                                        result = result + "<br>"
                                    }
                                    result = result +  "<a href='" + contextPath + "dokumen/download/" + data[i].filename + "'>" + data[i].filename + "</a>";
                                }
                                return result;
                            } else {
                                return "File tidak tersedia"
                            }
                        }
                    },
                    {
                        "name": "penanggung_jawab",
                        "data": "penanggungJawabTertandaTangan"
                    },
                    { 
                        "name": "jenis_dokumen",
                        "data": "jenisDokumen",
                        "render" : function (data, type, row, meta) {
                            if (data != null) {
                                return data.nama; 
                            }    
                            return "";
                        }
                     },
                    {
                        "name": "action",
                        "data": null,
                        "responsivePriority": 2,
                        "className": "text-center",
                        "width": "130",
                        "render": function (data, type, row, meta) {
                            var actions = "<a class='btn btn-sm btn-success mb-sm-1 inline-link ' href='" + contextPath + "dokumen_luar_negeri/view/" + row.id + "' data-bs-toggle='tooltip' data-bs-placement='top' title='Lihat'><svg class='myicon'><use xlink:href='#binoculars'></use></svg><span class='ms-sm-2'>Lihat</span></a>";

                            if (isSTAFF_CONTRIBUTOR || isAdmin) {
                                actions += "<a class='btn btn-sm btn-warning mb-sm-1 inline-link ' href='" + contextPath + "dokumen_luar_negeri/edit/" + row.id + "' data-bs-toggle='tooltip' data-bs-placement='top' title='Edit'><svg class='myicon'><use xlink:href='#pencil'></use></svg> <span class='ms-sm-2'>Rubah</span></a>";
                            }

                            if (isAdmin) {
                                actions += "<a class='btn btn-sm btn-danger mb-sm-1 inline-link ' id='delete'  onclick='showDeleteConfirmation(\"" + row.judulDokumen + "\"," + row.id + ")' href='#' data-bs-toggle='tooltip' data-bs-placement='top' title='Hapus'><svg class='myicon'><use xlink:href='#trash-can'></use></svg> <span class='ms-sm-2'>Hapus</span></a>";
                            }

                            return actions;
                        }
                    }
                ],
                "layout": {
                    "top2Start": {
                        "buttons": [
                            {
                                text: '<i class="fa-solid fa-plus"></i> Tambah Dokumen',
                                className: 'btn btn-sm btn-tambah',
                                action: function (e, dt, node, config) {
                                    window.location.href = contextPath + "dokumen_luar_negeri/add";
                                }
                            },
                            {
                                text: '<i class="fa-solid fa-right-long"></i> Export Excel',
                                className: 'btn btn-sm btn-excel',
                                action: function (e, dt, button, config) {
                                    var data = {};
                                    $.extend(data, dt.ajax.params());
                                    var params = dt.ajax.params();
                                    var searchValue = params.search.value;
                                    var flattened = flattenJson(data);
                                    console.log(params);

                                    const url = contextPath + "dokumen_luar_negeri/exportExcel";
                                    
                                    fetch(url, {
                                        method : "POST",
                                        body: params,
                                        headers: { "Content-Type": "application/json; charset=UTF-8", [header]: token }
                                    }).then(response => response.blob())
                                    .then(blob => {
                                        const filename = 'exportKLN.xlsx'; // Replace with desired filename
                                        const url = window.URL.createObjectURL(blob);
                                        const link = document.createElement('a');
                                        link.href = url;
                                        link.download = filename;
                                        link.click();
                                        window.URL.revokeObjectURL(url); // Revoke temporary URL
                                        })
                                    .catch(error => console.error(error));
                                }
                            },
                            {
                                "text": "Table Setup",
                                className: 'btn btn-sm btn-setup',
                                "action":  function (e, dt, button, config) {
                                    $('#setupConfirmationModal').modal('show');
                                }
                            },
                            {
                                "text": "Show/Hide Filter",
                                className: 'btn btn-sm btn-filter',
                                "action": function (e, dt, button, config) {
                                    $('#filter').toggle(function () {
                                        $('#panel').animate({
                                            height: "150",
                                            padding: "20px 0",
                                            backgroundColor: '#000000',
                                            opacity: .8
                                        }, 500);
                                    },
                                        function () {
                                            $('#panel').animate({
                                                height: "0",
                                                padding: "0px 0",
                                                opacity: .2
                                            }, 500);
                                        });
                                }
                            },
                            {
                                extend: 'print',
                                text: 'Print',
                                className: 'btn btn-sm btn-print',
                                autoPrint: true,
                                exportOptions: {
                                    modifier: {
                                        selected: true // Print only selected rows
                                    }
                                }
                            }

                        ]
                    }
                },
                "oLanguage": {
                    "sInfo": "Menampilkan <strong>_START_</strong> sampai <strong>_END_</strong> , total: <strong>_TOTAL_</strong> items"
                },
                "language": {
                    "lengthMenu": "_MENU_ &nbsp;records per halaman",
                    "emptyTable": "Maaf, tidak ada data tersedia."
                }

        function showDeleteConfirmation(title, id) { 
            id_to_delete = id; 
            $('#alertDokTitle').text(title);
            $('#deleteConfirmationModal').modal('show');
        }

        function flattenJson(data, name, flattened) {
            if (!flattened) {
                flattened = {};
            }
            if (!name) {
                name = '';
            }
            if ($.isPlainObject(data) || Array.isArray(data)) {
                $.each(data, function (idx, val) {
                    if (name === '') {
                        flattenJson(val, idx, flattened);
                    }
                    else {
                        flattenJson(val, name + '[' + idx.toString() + ']', flattened);
                    }
                });
            }
            else {
                flattened[name] = data;
            }
            return flattened;
        }

        function confirmDelete() {
            window.location.href = contextPath + "dokumen_luar_negeri/delete/" + id_to_delete;
