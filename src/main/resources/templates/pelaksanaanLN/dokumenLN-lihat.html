<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/general.html :: header('Lihat Dokumen KLN')}"></head>

<body class="nav-fixed">
    <nav th:replace="~{fragments/general.html :: navigation}"></nav>
    <div id="layoutSidenav">
        <div id="layoutSidenav_nav" th:include="~{fragments/general.html :: layoutSidenav_nav}"></div>

        <div id="layoutSidenav_content">
            <main>
                <!-- Main page content-->
                <div class="container-fluid px-4 py-5 mt-n10">
                    <div class="card my-4">
                        <div class="card-header">Detail Dokumen Kerja Sama Luar Negeri</div>
                        <div class="card-body">
                            <table class="table table-bordered table-sm table-condensed">
                                <thead>

                                </thead>
                                <tbody>
                                    <tr>
                                        <td>Tahun</td>
                                        <td th:text="${dokumen.tahun}"></td>
                                    </tr>
                                    <tr>
                                        <td>Subjek</td>
                                        <td th:text="${dokumen.subjek}"></td>
                                    </tr>
                                    <tr>
                                        <td>Tanggal</td>
                                        <td th:text="${#dates.format(dokumen.tgl,'dd/MM/yyyy')}"></td>
                                    </tr>
                                    <tr>
                                        <td>Tanggal Dimulai</td>
                                        <td th:text="${#dates.format(dokumen.tglDimulai,'dd/MM/yyyy')}"></td>
                                    </tr>
                                    <tr>
                                        <td>Tanggal Berakhir</td>
                                        <td th:text="${#dates.format(dokumen.tglBerakhir,'dd/MM/yyyy')}"></td>
                                    </tr>
                                    <tr>
                                        <td>Judul Dokumen</td>
                                        <td th:text="${dokumen.judulDokumen}"></td>
                                    </tr>
                                    <tr>
                                        <td>Keterangan</td>
                                        <td th:text="${dokumen.keterangan}"></td>
                                    </tr>

                                    <tr>
                                        <td>Jenis Dokumen</td>
                                        <td th:text="${dokumen.jenisDokumen} ? ${dokumen.jenisDokumen.nama} : ''"></td>
                                    </tr>
                                    <tr>
                                        <td>Penanggung Jawab Tertanda Tangan</td>
                                        <td th:text="${dokumen.penanggungJawabTertandaTangan}"></td>
                                    </tr>
                                    <tr>
                                        <td>Link dokumen</td>
                                        <td th:text="${dokumen.linkDokumen}"></td>
                                    </tr>
                                    <tr>
                                        <td>Files terkait</td>
                                        <td></td>
                                    </tr>
                                    <tr th:each=" doc : ${dokumen.dokumen}">
                                        <td></td>
                                        <td><a th:href="@{'/dokumen/download/' + ${doc.filename}}">[[${doc.filename}]]</a></td>
                                    </tr>

                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>

            </main>
        </div>
    </div>

    <div th:replace="~{fragments/general.html :: script}"></div>    
</body>
<script>
    $(document).ready(function() {
        
    });
</script>
</html>
