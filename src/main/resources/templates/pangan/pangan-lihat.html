<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/general.html :: header('Lihat Kolaborasi')}"></head>

<body class="sb-nav-fixed">
    <nav th:replace="~{fragments/general.html :: navigation}"></nav>
    <div id="layoutSidenav">
        <div id="layoutSidenav_nav" th:include="~{fragments/general.html :: layoutSidenav_nav}"></div>

        <div id="layoutSidenav_content" class="background01">
            <main>
                <!-- Main page content-->
                <div class="container-fluid px-4 py-5 mt-n10">
                    <div class="card my-4">
                        <div class="card-header">Detail Kerja Sama Bidang Pangan</div>
                        <div class="card-body">
                            <table class="table table-bordered">
                                <thead>

                                </thead>
                                <tbody>
                                    <tr>
                                        <td style="width: 200px;">Tahun</td>
                                        <td  th:text="${pangan.tahun}"></td>
                                    </tr>
                                    <tr>
                                        <td>Kelompok</td>
                                        <td></td>
                                    </tr>
                                    <tr th:each="kelompok: ${pangan.kelompok}">
                                        <td></td>
                                        <td th:text="${kelompok.nama}"></td>
                                    </tr>
                                    <tr>
                                        <td>Pemda</td>
                                        <td></td>
                                    </tr>
                                    <tr th:each="pemda: ${pangan.pemda}">
                                        <td></td>
                                        <td th:text="${pemda.nama}"></td>
                                    </tr>
                                    <tr>
                                        <td>BUMD</td>
                                        <td></td>
                                    </tr>
                                    <tr th:each="bumd: ${pangan.bumd}">
                                        <td></td>
                                        <td th:text="${bumd.nama}"></td>
                                    </tr>
                                    <tr>
                                        <td>Mitra Business</td>
                                        <td th:text="${pangan.mitraBusiness}"></td>
                                    </tr>
                                    <tr>
                                        <td>Kota/Kabupaten</td>
                                        <td></td>
                                    </tr>    
                                    <tr th:each="kota: ${pangan.kotaKabupaten}">
                                        <td></td>
                                        <td th:text="${kota.nama}"></td>
                                    </tr>
                                    <tr>
                                        <td>Jenis</td>
                                        <td></td>
                                    </tr>
                                    <tr th:each="jenis: ${pangan.jenis}">
                                        <td></td>
                                        <td th:text="${jenis.nama}"></td>
                                    </tr>
                                    <tr>
                                        <td>Kuantitas (Kg)</td>
                                        <td class="merrinumber" th:text="${#numbers.formatDecimal(pangan.kuantitas, 1, 'COMMA', 2, 'POINT')}"></td>
                                    </tr>
                                    <tr>
                                        <td>Nilai Transaksi (Rp)</td>
                                        <td class="merrinumber" th:text="${#numbers.formatDecimal(pangan.nilaiTransaksi, 1, 'COMMA', 2, 'POINT')}"></td>
                                    </tr>
                                    <tr>
                                        <td>Keterangan</td>
                                        <td th:text="${pangan.keterangan}"></td>
                                    </tr>

                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>

            </main>
        </div>
    </div>

    <div th:replace="~{fragments/general.html :: script}"></div>    
</body>
<script>
    $(document).ready(function() {
        
    });
</script>
</html>
